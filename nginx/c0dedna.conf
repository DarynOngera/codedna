# CODEDNA — c0dedna.com
#
# Drop this file into /etc/nginx/conf.d/c0dedna.conf on the EC2 instance
# (see scripts/provision-ec2.sh, which copies it for you).
#
# This file always parses, even before the Let's Encrypt cert exists, so the
# site is reachable over plain HTTP at the public IP while DNS is pending.
# Provision writes two fragments under /etc/nginx/codedna/:
#   - upgrade.conf     -> 'return 301 https://c0dedna.com$request_uri;' when the
#                         cert is live, or a no-op comment while it is not
#   - tls-server.conf  -> the :443 server blocks (from nginx/tls-server.conf)
#                         when the cert is live, or empty while it is not

# Real client IP: trust Cloudflare's CF-Connecting-IP when present (forwards a
# direct IP here), otherwise fall back to the socket address. No-Cloudflare setups
# simply skip the X-Forwarded-For spoof and use the real remote address.
map $http_cf_connecting_ip $real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# API throttling belt-and-braces layer (the Node app also rate limits per IP).
limit_req_zone $real_ip zone=codedna_api:10m rate=10r/m;

# ---------------------------------------------------------------------------
# Site + API proxy (HTTP). Routes 301 -> HTTPS for the canonical hostname once
# the cert exists; until then it is the default catch-all that serves the site,
# so http://<public-ip>/ works long before DNS is wired up.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name c0dedna.com www.c0dedna.com;

    include /etc/nginx/codedna/upgrade.conf;

    server_tokens off;

    root /var/www/codedna/current;
    index index.html;

    # Security headers (static + proxied responses) — deliberate, no wildcards.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Contact API -> Node (loopback only, never exposed directly).
    location /api/ {
        limit_req zone=codedna_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $real_ip;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_redirect off;
    }

    # Content-hashed build assets: cache forever (immutable).
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# :443 server blocks (www -> apex redirect + TLS site). Included only after the
# Let's Encrypt cert exists; empty file (no servers) before that.
include /etc/nginx/codedna/tls-server.conf;
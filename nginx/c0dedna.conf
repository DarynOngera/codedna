# CODEDNA — c0dedna.com
#
# Drop this file into /etc/nginx/conf.d/c0dedna.conf on the EC2 instance
# (see scripts/provision-ec2.sh, which copies it for you).

# Real client IP: trust Cloudflare's CF-Connecting-IP when present (forwards a
# direct IP here), otherwise fall back to the socket address. No-Cloudflare setups
# simply skip the X-Forwarded-For spoof and use the real remote address.
map $http_cf_connecting_ip $real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# API throttling belt-and-braces layer (the Node app also rate limits per IP).
limit_req_zone $real_ip zone=codedna_api:10m rate=10r/m;

# ---------------------------------------------------------------------------
# HTTP -> HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name c0dedna.com www.c0dedna.com;
    return 301 https://c0dedna.com$request_uri;
}

# ---------------------------------------------------------------------------
# www -> apex (TLS preserved)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.c0dedna.com;

    ssl_certificate     /etc/letsencrypt/live/c0dedna.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c0dedna.com/privkey.pem;

    return 301 https://c0dedna.com$request_uri;
}

# ---------------------------------------------------------------------------
# Main site + API proxy
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name c0dedna.com;

    ssl_certificate     /etc/letsencrypt/live/c0dedna.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c0dedna.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    root /var/www/codedna/current;
    index index.html;

    # Security headers (static + proxied responses) — deliberate, no wildcards.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Contact API -> Node (loopback only, never exposed directly).
    location /api/ {
        limit_req zone=codedna_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_redirect off;
    }

    # Content-hashed build assets: cache forever (immutable).
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}